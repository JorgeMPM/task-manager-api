# Puerto HTTP
server.port=8080

# Conexión a MySQL: se lee de variables de entorno; los valores tras ':' son los de por defecto
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate: solo valida que las entidades coinciden con las tablas (db/schema.sql)
spring.jpa.hibernate.ddl-auto=validate

# JWT: en producción la clave debe venir de la variable JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-no-usar}
jwt.expiration=86400000
